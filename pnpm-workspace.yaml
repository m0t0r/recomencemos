# Fail installs outright when the running Node does not satisfy `engines.node`
# in package.json, instead of printing a warning and continuing.
engineStrict: true

packages:
  - "apps/*"
  - "packages/*"

# `@sentry/nextjs` loads these two module-interception packages by bare specifier
# from inside its own server instrumentation, so pnpm's isolated store has to put
# them where a bare `require`/`import` from the app can see them. pnpm 11 reads
# its settings from this file, not `.npmrc` (see CLAUDE.md), which is also why
# the entry lands in a file pnpm owns and oxfmt ignores.
#
# This replaces pnpm's default pattern list (`*eslint*`, `*prettier*`); neither
# tool is used here — linting and formatting are oxlint and oxfmt.
publicHoistPattern:
  - "import-in-the-middle"
  - "require-in-the-middle"
# Releases accepted inside pnpm's supply-chain cooldown, pinned to the exact
# version that was accepted. An entry is spent the moment the lock stops naming
# that version, so this list is pruned rather than appended to forever: `grep
# '<name>@<version>' pnpm-lock.yaml` is the whole test, and an entry with no hit
# is a line to delete. The name belongs in the pattern — a bare version number
# matches any unrelated package that happens to sit at it.
#
# The ten `16.3.2` entries that used to sit here went that way: nine `@next/*`
# and a bare `next`, all spent, because the lock resolves 16.3.0 and 16.3.3 and
# names 16.3.2 in it zero times.
#
# Neither entry below needed a companion for the security patches in
# `overrides`, but only one of them comfortably: `qs@6.16.0` was five days old
# when it was taken and `fast-uri@3.1.7` was 33 hours, against a 24-hour window.
# Nine hours earlier that second one would have needed a line here.
minimumReleaseAgeExclude:
  - shadcn@4.19.0
  - resend@6.24.0

# `@sentry/cli`'s postinstall is a *fallback* downloader, not the install step:
# it resolves `@sentry/cli-<platform>` — an optional dependency pnpm has already
# placed — and exits 0 when it finds one, fetching from the CDN only for installs
# run with `--no-optional`. Denying it therefore costs nothing on any supported
# platform, and keeps a fresh clone's `pnpm install` free of both an arbitrary
# postinstall and the `ERR_PNPM_IGNORED_BUILDS` non-zero exit an undecided entry
# here produces.
#
# What was checked rather than assumed: `require("@sentry/cli").getPath()`
# returns a path inside `@sentry/cli-darwin` and that file exists, so the binary
# the upload needs is present without the postinstall. What that does *not*
# prove is an upload — that needs real credentials, so the first credentialed
# build is the one to watch. If it ever fails to find the binary, the fix is to
# flip this to `true`, not to unpick anything else.

# `esbuild`'s postinstall is a *verifier*, not the install step, in the same way
# `@sentry/cli`'s is: it resolves the platform package pnpm has already placed —
# `@esbuild/darwin-arm64` and friends — and only downloads a binary when there
# isn't one. It arrives here as a transitive dependency of `drizzle-kit`, which
# is the only thing in this repo that runs it.
#
# What was checked rather than assumed: with this denied, `pnpm exec drizzle-kit
# generate` runs and writes `packages/domain/drizzle/0000_initial_rate_counter.sql`.
# That is the whole of esbuild's job here — generation is the only drizzle-kit
# command this repo uses, because applying migrations is `@repo/domain/migrate`
# on the direct connection (spec 0002, DD10) and never the CLI.
#
# An undecided entry is not neutral: it exits `pnpm install` non-zero with
# `ERR_PNPM_IGNORED_BUILDS`, so this has to say something. If `drizzle-kit
# generate` ever fails to find its binary, the fix is to flip this to `true`.
allowBuilds:
  "@sentry/cli": false
  esbuild: false

# GHSA-67mh-4wv8-2f99 (esbuild <= 0.24.2): esbuild's dev server sets
# `Access-Control-Allow-Origin: *` on every response, so any website the
# developer happens to visit can read whatever that server is serving. It
# reaches this repo through one chain and one only:
#
#   drizzle-kit -> @esbuild-kit/esm-loader -> @esbuild-kit/core-utils -> esbuild@0.18.20
#
# Both `@esbuild-kit/*` packages are deprecated ("Merged into tsx"), and
# `drizzle-kit` already depends on `tsx` *and* on `esbuild@^0.25.4` directly —
# the esm-loader is vestigial. But it is still declared, so pnpm still installs
# the old esbuild behind `core-utils`'s `~0.18.20` pin, which no dedupe can
# reach.
#
# What was checked rather than assumed: `core-utils` calls exactly three things
# on esbuild — `transformSync`, `transform`, and `version`. It never calls
# `serve`, which is the whole of the vulnerable surface, so the advisory was
# already unreachable here. The override is taken anyway because it costs one
# line, dedupes onto the 0.25.12 `drizzle-kit` already resolves, and leaves
# nothing for a future reader to re-derive.
#
# Scoped to the one package rather than global: `drizzle-kit`, `vite` and
# `webpack` each resolve their own esbuild, and a bare `esbuild:` override would
# silently pin all three to this range.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"

  # GHSA-f65p-4m7j-42xc, GHSA-jqff-g426-hqxp, GHSA-5jgf-p345-68v8 and
  # GHSA-fph4-wmhf-6fwf (fast-uri < 3.1.6, four `high`): host confusion and
  # server-side request forgery through URI normalisation — a percent-encoded
  # scheme, a repeatedly percent-decoded hostname, a malformed IPv6 literal, and
  # IDN canonicalisation skipped on a scheme-relative reference.
  #
  # `ajv` is the only package here that depends on it, and it calls it to
  # resolve `$id`/`$ref` in a JSON Schema. Four chains reach it and none is a
  # request path: `shadcn -> @modelcontextprotocol/sdk`, `shadcn ->
  # @dotenvx/dotenvx -> conf -> ajv-formats`, `@sentry/nextjs ->
  # @sentry/webpack-plugin -> webpack -> schema-utils -> ajv-formats`, and
  # `react-email -> conf -> ajv-formats`. Each validates its own schemas, so no
  # attacker-supplied URI reaches the parser — the advisories were already
  # unreachable, and the override is taken for the reason the esbuild one above
  # is: it costs a line and leaves nothing for a later reader to re-derive.
  #
  # What was checked rather than assumed: `ajv@8.20.0` asks for `^3.0.1`, so the
  # fix was always in range and only the lock was holding 3.1.5 — but
  # `pnpm update -r fast-uri` does not move it (the same command reaches `qs`
  # below and stops short of this), while resolving `ajv@8.20.0` alone in an
  # empty project picks 3.1.7. The override is therefore what makes the floor
  # reproducible from config instead of from whatever the lock happens to hold.
  #
  # Scoped rather than bare, for the reason the esbuild entry gives: fast-uri's
  # own latest is 4.x, and a bare `^3.1.6` would hold a future direct consumer
  # to a major it never asked for.
  #
  # Review and remove once `ajv` resolves 3.1.6 or later unaided: drop the line,
  # run `pnpm install --lockfile-only`, and read `pnpm why fast-uri`.
  "ajv>fast-uri": "^3.1.6"

  # GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx (qs < 6.16.0, two `medium`):
  # denial of service through an attacker-controlled `isBuffer`, and an
  # array-limit bypass through comma parsing inside a bracket key.
  #
  # One chain, and it belongs to a CLI: `shadcn -> @modelcontextprotocol/sdk ->
  # express`, with `body-parser` underneath that same express. `shadcn` is a
  # runtime `dependencies` entry of `@repo/design-system` — it owns the
  # `@import "shadcn/tailwind.css"` in `globals.css` — so qs does sit in the
  # production graph rather than a dev-only one. What it does not sit in is any
  # code path: no workspace imports express, Next.js parses its own query
  # strings, and the only surface is the MCP server `shadcn` can start, which
  # neither `pnpm dev` nor the build ever does.
  #
  # Both parents already ask for a range admitting the fix (`express@5.2.1`
  # wants `^6.14.0`, `body-parser@2.3.0` wants `^6.15.2`), so this is a floor
  # and not a forced upgrade. Two scoped entries rather than one bare `qs`,
  # because express and body-parser resolve it separately and a bare override
  # would silently also catch a consumer nobody has looked at.
  #
  # Review and remove once both parents resolve 6.16.0 or later unaided, by the
  # same three steps as the entry above.
  "body-parser>qs": "^6.16.0"
  "express>qs": "^6.16.0"
