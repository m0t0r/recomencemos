# Fail installs outright when the running Node does not satisfy `engines.node`
# in package.json, instead of printing a warning and continuing.
engineStrict: true

packages:
  - "apps/*"
  - "packages/*"

# **`pnpm-lock.yaml` stays a single YAML document, and this is the line that
# keeps it one.**
#
# pnpm 12 manages its own version: given a `packageManager` pin it downloads and
# runs that version, and records having done so in a *second* YAML document at
# the head of the lockfile — `packageManagerDependencies`, plus a `@pnpm/exe.*`
# entry for each of the eight platforms. The dependency graph then sits in the
# second document of the stream.
#
# dependabot-core reads only the first. It reports zero dependencies for every
# manifest and closes existing alerts without performing an update
# (dependabot/dependabot-core#15904, open; the two support pull requests are
# unmerged). That is the one regression this repo cannot absorb quietly:
# `.github/dependabot.yml` records six advisories, four of them `high`, that sat
# on the default branch while every pull request went green.
#
# `ignore` is what suppresses the document, and `error` and `warn` are **not**
# substitutes — measured, not assumed: both still emit it, because both still
# manage the version. This is the "external tools manage versions" case pnpm's
# own documentation names, and here there are three of them.
#
# Two *select* the version, both from `packageManager`: Corepack in the
# `Dockerfile`, and `pnpm/action-setup` in `.github/actions/setup`. The third
# *refuses the wrong one*, and it is the reason giving up pnpm's own check costs
# so little: `engines.pnpm` is `>=12` and `engineStrict` above makes that fail
# rather than warn, so pnpm 11 against this repo exits
# `ERR_PNPM_UNSUPPORTED_ENGINE` naming the expected version. Checked by running
# it. The residual gap is a *newer* pnpm than the pin, which satisfies `>=12`
# and installs — the lockfile is the thing that would notice, and CI runs the
# pinned version.
#
# Revisit when dependabot-core ships pnpm 12 support
# (dependabot/dependabot-core#16095, open): drop this line, run
# `pnpm install`, and confirm Dependabot still resolves a graph from the
# two-document lockfile before leaving it dropped.
pmOnFail: ignore

# `@sentry/nextjs` loads these two module-interception packages by bare specifier
# from inside its own server instrumentation, so pnpm's isolated store has to put
# them where a bare `require`/`import` from the app can see them. pnpm reads
# its settings from this file, not `.npmrc` (see CLAUDE.md), which is also why
# the entry lands in a file pnpm owns and oxfmt ignores.
#
# This replaces pnpm's default pattern list (`*eslint*`, `*prettier*`); neither
# tool is used here — linting and formatting are oxlint and oxfmt.
publicHoistPattern:
  - "import-in-the-middle"
  - "require-in-the-middle"
# Releases accepted inside pnpm's supply-chain cooldown go in
# `minimumReleaseAgeExclude`, pinned to the exact version accepted. **The list is
# empty, so the key is absent** — that is the steady state, not an oversight. An
# entry is spent the moment the lock stops naming its version, so the list is
# pruned rather than appended to forever: `grep '<name>@<version>'
# pnpm-lock.yaml` is the whole test, and an entry with no hit is a line to
# delete. The name belongs in the pattern — a bare version number matches any
# unrelated package that happens to sit at it.
#
# Everything that has ever sat here left that way. First the ten `16.3.2`
# entries — nine `@next/*` and a bare `next` — because the lock resolves 16.3.0
# and 16.3.3 and names 16.3.2 zero times. Then `shadcn@4.19.0` and
# `resend@6.24.0`, because the lock resolves 4.21.0 and 6.26.0 (#212).
#
# Worth knowing before the next one is added: neither of those two needed a
# companion for the security patches in `overrides`, but only one of them
# comfortably. `qs@6.16.0` was five days old when it was taken; `fast-uri@3.1.7`
# was 33 hours, against a 24-hour window. Nine hours earlier it would have
# needed a line here.

# `@sentry/cli`'s postinstall is a *fallback* downloader, not the install step:
# it resolves `@sentry/cli-<platform>` — an optional dependency pnpm has already
# placed — and exits 0 when it finds one, fetching from the CDN only for installs
# run with `--no-optional`. Denying it therefore costs nothing on any supported
# platform, and keeps a fresh clone's `pnpm install` free of both an arbitrary
# postinstall and the `ERR_PNPM_IGNORED_BUILDS` non-zero exit an undecided entry
# here produces.
#
# What was checked rather than assumed: `require("@sentry/cli").getPath()`
# returns a path inside `@sentry/cli-darwin` and that file exists, so the binary
# the upload needs is present without the postinstall. What that does *not*
# prove is an upload — that needs real credentials, so the first credentialed
# build is the one to watch. If it ever fails to find the binary, the fix is to
# flip this to `true`, not to unpick anything else.

# `esbuild`'s postinstall is a *verifier*, not the install step, in the same way
# `@sentry/cli`'s is: it resolves the platform package pnpm has already placed —
# `@esbuild/darwin-arm64` and friends — and only downloads a binary when there
# isn't one. It arrives here as a transitive dependency of `drizzle-kit`, which
# is the only thing in this repo that runs it.
#
# What was checked rather than assumed: with this denied, `pnpm exec drizzle-kit
# generate` runs and writes `packages/domain/drizzle/0000_initial_rate_counter.sql`.
# That is the whole of esbuild's job here — generation is the only drizzle-kit
# command this repo uses, because applying migrations is `@repo/domain/migrate`
# on the direct connection (spec 0002, DD10) and never the CLI.
#
# An undecided entry is not neutral: it exits `pnpm install` non-zero with
# `ERR_PNPM_IGNORED_BUILDS`, so this has to say something. If `drizzle-kit
# generate` ever fails to find its binary, the fix is to flip this to `true`.
allowBuilds:
  "@sentry/cli": false
  esbuild: false

# GHSA-67mh-4wv8-2f99 (esbuild <= 0.24.2): esbuild's dev server sets
# `Access-Control-Allow-Origin: *` on every response, so any website the
# developer happens to visit can read whatever that server is serving. It
# reaches this repo through one chain and one only:
#
#   drizzle-kit -> @esbuild-kit/esm-loader -> @esbuild-kit/core-utils -> esbuild@0.18.20
#
# Both `@esbuild-kit/*` packages are deprecated ("Merged into tsx"), and
# `drizzle-kit` already depends on `tsx` *and* on `esbuild@^0.25.4` directly —
# the esm-loader is vestigial. But it is still declared, so pnpm still installs
# the old esbuild behind `core-utils`'s `~0.18.20` pin, which no dedupe can
# reach.
#
# What was checked rather than assumed: `core-utils` calls exactly three things
# on esbuild — `transformSync`, `transform`, and `version`. It never calls
# `serve`, which is the whole of the vulnerable surface, so the advisory was
# already unreachable here. The override is taken anyway because it costs one
# line, dedupes onto the 0.25.12 `drizzle-kit` already resolves, and leaves
# nothing for a future reader to re-derive.
#
# Scoped to the one package rather than global: `drizzle-kit`, `vite` and
# `webpack` each resolve their own esbuild, and a bare `esbuild:` override would
# silently pin all three to this range.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"

  # GHSA-p293-qw3h-jr36 and GHSA-2xp9-vwfh-vxw4 (next >=16.0.0 <16.3.3), both
  # `critical`, both unauthenticated remote code execution — one on
  # Windows-hosted servers, one in the Image Optimization API when AVIF files
  # are used. They reach this repo through exactly one chain:
  #
  #   @react-email/ui -> next@16.3.0 -> sharp@0.35.3
  #
  # `@react-email/ui@6.9.3` pins `next` to the **exact** version `16.3.0`, so no
  # dedupe and no version bump of anything already in the lock can move it —
  # which is the case `overrides` exists for.
  #
  # Worth stating plainly, because the gate's wording invites the wrong
  # conclusion: `pnpm audit:direct` reports these as a **direct** dependency and
  # blocks on them, but the vulnerable *instance* is transitive and dev-only.
  # `next` is a direct dependency of `web` at 16.3.4 — already patched — and the
  # audit matches an advisory to a workspace manifest by package name rather
  # than by the path that is actually vulnerable. The block is still correct to
  # act on; the reachability answer is that `@react-email/ui` is a
  # `devDependencies` entry of `@repo/notifications` serving the `email dev`
  # preview, so neither advisory is in any deployed path. Neither is reachable
  # here on its own terms either: nothing hosts on Windows, and the Image
  # Optimization API is not reached — `apps/web/next.config.ts` carries no
  # `images` key at all.
  #
  # `sharp` comes along for free and is the entry's second reason.
  # GHSA-rgj7-g3m4-5g8c (`high`, libheif) is against `sharp@<0.35.4`, which is
  # what `next@16.3.0` resolves; `next@16.3.4` declares `^0.35.4`. That matters
  # more than a transitive `high` usually would, because `@repo/storage` decodes
  # attacker-supplied bytes through sharp on the photo path, and its
  # `DECODABLE_FORMATS` currently admits `avif` and `heif` — the two decoders
  # this advisory is about.
  #
  # Pinned to the version already in the lock rather than a range, so this line
  # dedupes the tree to one `next` and one `sharp` instead of adding a third.
  #
  # **Drop it when `@react-email/ui` is next taken.** 6.9.5 pins `next@16.3.3`
  # and is unaffected, but it was six hours old when this was written — inside
  # pnpm's 1440-minute cooldown — so taking it would have needed a
  # `minimumReleaseAgeExclude` entry to buy a worse tree (two `next` copies
  # rather than one). The removal test is this file's own: drop the line, move
  # `pnpm-lock.yaml` aside, `pnpm install --lockfile-only`, and check that
  # nothing below 16.3.3 comes back.
  "@react-email/ui>next": "16.3.4"

  # **Three entries left this map on 2026-09-08, and the test that took them out
  # is written here so the next reader runs it rather than re-deriving it.**
  # `ajv>fast-uri` (`^3.1.6`), `body-parser>qs` and `express>qs` (both
  # `^6.16.0`) were floors under four `high` and two `medium` advisories, and
  # each carried the same removal condition: "resolves X or later unaided".
  #
  # Reading the lock proves nothing while the override is applied — it reports
  # the floor being enforced, not the floor being unnecessary. So the test was a
  # **cold** resolution: all three lines dropped, `pnpm-lock.yaml` moved aside
  # entirely, `pnpm install --lockfile-only`. Unaided, pnpm picks
  # `fast-uri@3.1.7` and `qs@6.16.0` — one version of each, both above their
  # floors. With the lock restored and only the three lines dropped, the lock
  # diff is exactly those three lines, and `pnpm audit:direct` and
  # `pnpm audit:report` are both clean. The three are independent — different
  # packages, different parents — which is why one cold run answers all three.
  #
  # Worth keeping from what those comments said, because it is the part that is
  # about this repository rather than about a version number: none of the six
  # advisories was ever reachable here. They are GHSA-f65p-4m7j-42xc,
  # GHSA-jqff-g426-hqxp, GHSA-5jgf-p345-68v8 and GHSA-fph4-wmhf-6fwf against
  # fast-uri, and GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx against qs — named
  # here because `audit-report.mjs` reports a GHSA id, and a triager who meets
  # one of these needs somewhere that maps it back to the reachability answer.
  #
  # `ajv` calls fast-uri to resolve `$id`/`$ref` in schemas it owns. `qs` is the
  # one that needs its caveat stated rather than summarised: it **does** sit in
  # the production graph, because `shadcn` is a runtime `dependencies` entry of
  # `@repo/design-system` — it owns the `@import "shadcn/tailwind.css"` in
  # `globals.css`. What it does not sit in is any code path: no workspace
  # imports express, Next.js parses its own query strings, and the only surface
  # is the MCP server `shadcn` can start, which neither `pnpm dev` nor the build
  # ever does.
  #
  # The overrides existed to make the floor reproducible from config rather than
  # from whatever the lock happened to hold; the registry now reproduces it, so
  # the config is the thing to drop.
  #
  # If a future resolution ever falls back below either floor, the actor is
  # `.github/workflows/security-audit.yml` — `audit-report-threshold` is
  # `moderate` and above, transitive included, which is wide enough to catch
  # both. Re-adding a line here is that finding's fix, not a precaution to take
  # in advance.
