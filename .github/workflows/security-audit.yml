# The actor for the half `pnpm audit:direct` deliberately lets past.
#
# CI's `audit` job blocks a pull request on `high` or above in a **direct**
# dependency and never on a transitive one, which is the right blocking rule
# (`docs/policy/security.md` -> `dependency-policy`). What it leaves is a class
# of advisory that nothing acts on at all, and the size of that gap was measured
# rather than predicted: six advisories sat on the default branch, four of them
# `high`, while every pull request went green.
#
# **Dependabot is not the missing actor, which is the thing to know before
# deleting this workflow as redundant.** Security updates are enabled on this
# repository and it opened no pull request for any of the six, because
# dependabot-core does not support updating transitive dependencies for the pnpm
# ecosystem (dependabot/dependabot-core#13177). All six were transitive. Each
# needed a scoped `overrides` entry in `pnpm-workspace.yaml` -- a manifest edit
# no version bump produces.
#
# So this workflow reports. It does not fix and it does not block: patching is a
# judgement about reachability that belongs to a person, and the finding reaches
# them the way every other finding does, as a `needs-triage` issue
# (`docs/adr/0001-findings-enter-through-triage.md`, and `alert-destination` in
# `docs/policy/operability.md`). `needs-triage.yml` is the same shape for the
# same reason; this is its dependency-side sibling.
#
# **It reads `pnpm audit`, not the Dependabot alerts API, and that is a
# constraint rather than a preference.** The default `GITHUB_TOKEN` can never
# read Dependabot alerts -- the Actions app cannot be granted that permission --
# so that route needs a stored personal access token with `security_events`, a
# credential to rotate and a human step to set up. `pnpm audit` needs neither and
# reads the same GitHub Advisory data through the registry. Checked rather than
# assumed on the day this was written: the two agreed on all six advisories,
# package for package and severity for severity.
#
# **The lifecycle -- file, edit in place, close when clean, honour a closed
# issue as a dismissal -- is `scripts/findings.mjs audit`**, driven case by case
# in `.claude/hooks/tests/findings.sh` with `gh` stubbed. It used to be a hundred
# lines of bash here that nothing ran until the day it ran for real; this file
# is now the wiring and nothing else
# (`docs/adr/0020-gate-logic-is-a-script-with-a-suite-and-the-wiring-stays-thin.md`).
#
# **A scheduled workflow is disabled automatically after 60 days with no commits
# to the repository.** That is GitHub's behaviour, not a setting here, and it is
# the one way this can die quietly. A repository active enough to need a
# dependency audit is active enough to keep it alive, but if the finding feed
# ever goes silent for a long stretch, that is the first thing to check.
name: security-audit

on:
  # Daily, not weekly. An advisory is published on whatever day it is published,
  # and a weekly cadence would mean up to seven days between a `high` landing in
  # the tree and anybody hearing about it. A clean run opens nothing and comments
  # nothing, so the cost of the extra six runs is six runner-minutes.
  #
  # 11:00 UTC is 06:00 in America/Bogota, matching the hour `dependabot.yml`
  # already uses -- cron has no timezone, so the offset is applied here by hand.
  # Colombia does not observe daylight saving, so this does not drift.
  schedule:
    - cron: "0 11 * * *"

  # So the receiver can be proved without waiting a day, and so a human who
  # suspects something has the same one-click route as the schedule.
  workflow_dispatch:

# `issues: write` and read-only on the contents. This job opens an issue; it has
# no business touching a branch, and a read-only token cannot be made to.
permissions:
  contents: read
  issues: write

# A second run started while the first is mid-flight could read "no open issue"
# before the first has created one, and open a duplicate. Queued rather than
# cancelled: a cancelled run is a day nobody was told.
concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `turbo-cache: "false"` for the reason the `lint` and `audit` jobs set it:
      # this job calls node directly and runs no Turborepo task, so the cache
      # would be written once per run and read by nothing. The install is needed
      # here, unlike in `needs-triage.yml`: `pnpm audit` reads the lockfile and
      # the store.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - name: Audit and route the finding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/findings.mjs audit
