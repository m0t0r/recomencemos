# A control-band breach lands as a `needs-triage` issue in this repository.
#
# That destination is not a choice this workflow makes. `alert-destination` in
# `docs/policy/operability.md` sets it -- "machine bands -> a `needs-triage`
# issue from CI" -- and that key in turn follows from
# `docs/adr/0001-findings-enter-through-triage.md`, which fixes that findings
# reach Plan only through `/triage`. A breach that arrives as a chat message is
# a breach nobody owns.
#
# This is the CI half of `docs/runbooks/recomencemos-go-live.md` §5's last row,
# and it consumes the webhook drawn in `observability-go-live.md` §6.
#
# **What this workflow does not do: reach the vendor.** It listens; something
# has to POST to it. `POST /repos/{owner}/{repo}/dispatches` requires an
# `Authorization` header, and an alerting vendor that cannot attach one needs a
# minimal relay in front of it. That relay -- or the token -- is the human's
# step, which is why `observability-go-live.md` §6 draws the box as "your
# endpoint / GitHub Action" and why `alert-destination` names the shape and not
# a URL. `scripts/go-live.sh` stage 22 is where a human wires and tests it.
#
# **What it also does not do: decide anything.** The four-field check, the
# label and the issue are `scripts/findings.mjs breach`, driven by
# `.claude/hooks/tests/findings.sh`; this file is the wiring
# (`docs/adr/0020-gate-logic-is-a-script-with-a-suite-and-the-wiring-stays-thin.md`).
name: needs-triage

on:
  repository_dispatch:
    types: [control-band-breach]
  # So the receiver can be proved without a token, and so a human who spots a
  # breach by eye has the same one-click route as the machine.
  workflow_dispatch:
    inputs:
      band:
        description: "Which band, and its threshold"
        required: true
      observed:
        description: "The observed value, with its window"
        required: true
      surface:
        description: "The affected surface -- the route pattern, so it joins with log lines"
        required: true
      first_check:
        description: "First thing to check"
        required: true

# `issues: write` and nothing else. This job opens an issue; it has no business
# reading code or touching a branch.
permissions:
  contents: read
  issues: write

jobs:
  open-finding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No `pnpm install`: the script imports nothing outside Node's standard
      # library and shells out to `gh`, which the runner already has.
      #
      # Every payload field arrives through `env`, never interpolated into the
      # command. A `client_payload` is written by whatever holds the dispatch
      # token, so `${{ }}` inside `run:` would be a shell injection with an
      # alert rule as its trigger.
      - name: Open the finding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BAND: ${{ github.event.client_payload.band || inputs.band }}
          OBSERVED: ${{ github.event.client_payload.observed || inputs.observed }}
          SURFACE: ${{ github.event.client_payload.surface || inputs.surface }}
          FIRST_CHECK: ${{ github.event.client_payload.first_check || inputs.first_check }}
        run: node scripts/findings.mjs breach
