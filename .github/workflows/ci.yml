# The gate from `docs/policy/build.md` -> `required-checks`, run on the pull
# request instead of on a developer's terminal.
#
# Six jobs rather than one job with six steps, because
# `docs/runbooks/recomencemos-go-live.md` §8 asks a human to set required status
# checks named `lint`, `format`, `check-types`, `test`, `build` and the
# dependency audit -- and a required status check is a job name. One job would
# leave that step with one check to require and five names that do not exist.
#
# Each job runs the same root script a developer runs, so the two cannot drift;
# `turbo run` lives in package.json, not here.
name: CI

# `pull_request` is the gate. `push` on the default branch is what makes the
# Turborepo cache worth having: GitHub scopes a cache to the branch that wrote it
# plus that branch's descendants, so without a run on `dev` there is nothing for
# a new pull request to restore from and every one of them starts cold.
on:
  pull_request:
  push:
    branches: [dev]

  # Called by `deploy.yml` before it ships anything to Fly, so the five checks a
  # pull request had to pass are the same five, run by the same jobs, on the
  # commit actually being deployed. Restating them in the deploy workflow would
  # give this repository two definitions of "green" that drift apart quietly.
  workflow_call:

# The production gate, as a permission rather than as a convention: a read-only
# GITHUB_TOKEN cannot push to the default branch and cannot merge a pull request,
# whatever any step goes on to run.
permissions:
  contents: read

# A superseded run tells you about a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm lint

  # `pnpm format` is `oxfmt --check`, so this job reports rather than rewrites.
  #
  # It exists because its absence was measured, not predicted: three files under
  # `docs/` sat unformatted on `dev` and every local `pnpm format:fix` rewrote
  # them, so 54 lines of unrelated churn appeared in whatever pull request its
  # author happened to be writing. During #80 that happened three times and was
  # reverted three times. Formatting drift is invisible without a gate, and the
  # cost of the drift is paid by a *different* change than the one that caused it.
  #
  # `turbo-cache: "false"` for the same reason `lint` sets it: oxfmt reads the
  # whole tree in under a second, so a cache restore costs more than the work.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm format

  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check-types

  # `pnpm test` is `turbo run test test:gates spec-identifiers migrations:check`, so
  # the stage-hook suite is inside this job rather than beside it -- which is what
  # `required-checks` means by "test (including test:gates)".
  #
  # `fetch-depth: 0` because `migrations:check` frames every one of its answers on
  # `git merge-base <default branch> HEAD` (NFR30, DD13). The default shallow
  # checkout has no merge base, and that gate refuses to call "I could not
  # compare" a pass -- it would exit 2 the day the first migration lands.
  #
  # `set-head` is the other half of the same sentence, and it is the half that was
  # missing: the gate needs a *default branch* as well as the history reaching it.
  # On a `pull_request` it reads GITHUB_BASE_REF, which GitHub sets and which is
  # the PR's own base -- the stacked-PR case DD13 depends on. On a `push` that
  # variable does not exist, so the gate falls back to `refs/remotes/origin/HEAD`,
  # the ref every `git clone` writes and `actions/checkout` does not. The run on
  # `dev` therefore exited 2 the day the first migration landed -- for the
  # neighbouring reason, one step earlier than the paragraph above predicted.
  #
  # The branch is read from the webhook payload rather than asked of the remote
  # (`set-head --auto`) or written here as `dev`: the payload carries it on both
  # events, so this costs no network round-trip and no credential, and a clone
  # whose default branch is not `dev` is still not a special case. It goes through
  # `env` rather than into the command line because a `${{ }}` expanded into a
  # shell is an injection seam whatever this particular value happens to be.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Give `migrations:check` a default branch to measure against
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git remote set-head origin "$DEFAULT_BRANCH"
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  # High or above in a *direct* dependency only. The script says why, and
  # `gate-test.sh` holds its cases.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm audit:direct
