# The gate from `docs/policy/build.md` -> `required-checks`, run on the pull
# request instead of on a developer's terminal.
#
# One job per required check rather than one job with a step each, because
# `docs/runbooks/recomencemos-go-live.md` §8 asks a human to set required status
# checks named `lint`, `format`, `check-types`, `test`, `build` and the
# dependency audit -- and a required status check is a job name. One job would
# leave that step with one check to require and names that do not exist.
#
# Each job runs the same root script a developer runs, so the two cannot drift;
# `turbo run` lives in package.json, not here.
name: CI

# `pull_request` is the whole gate and the only trigger a person's work reaches:
# a merge into the default branch re-runs nothing. The commit that lands on `dev`
# is the commit the gate already passed on the pull request that produced it, so
# a second run of the same jobs re-answers a question that has an answer.
#
# **What that gave up, measured rather than argued.** GitHub scopes a cache to
# the branch that wrote it plus that branch's descendants, so a run on `dev` was
# the only thing that could leave a warm Turborepo cache for a pull request
# branch that does not exist yet. Three jobs stayed on the merge run for that
# reason, at 147 runner-seconds a merge. Run 34356751566 is the next pull request
# to restore what they wrote, and it is what those seconds bought:
#
#     build        83s of the 147   ->  0 cached, 1 total. A miss.
#     test         42s              ->  4 of 9 cached
#     check-types  22s              ->  6 of 6 cached, 26ms of task time
#
# The largest job warmed nothing and never could: `apps/web`'s build hash
# includes the app's own source, which is the one thing every pull request
# changes. What the other two saved is single-digit seconds of task time, against
# a 12-second setup step paid either way. So this is not a gate traded for speed
# -- the gate is untouched, and every job it ever ran still runs on every pull
# request. A new branch's first run is colder; every push after it restores that
# branch's own cache through the `restore-keys` prefix, which is the case that
# actually repeats.
on:
  # Opened, pushed to, reopened. That is GitHub's own default for this event,
  # written out because it is the requirement rather than an inherited default:
  # a `types:` key added later for some fourth activity replaces this list
  # rather than extending it, and an unwritten default is the thing such an edit
  # silently drops. `reopened` belongs with the other two -- a branch reopened
  # weeks later has a base it was never gated against.
  pull_request:
    types: [opened, synchronize, reopened]

  # Called by `deploy.yml` before it ships anything to Fly, so the checks a
  # pull request had to pass are the same checks, run by the same jobs, on the
  # commit actually being deployed. Restating them in the deploy workflow would
  # give this repository two definitions of "green" that drift apart quietly.
  workflow_call:

# The production gate, as a permission rather than as a convention: a read-only
# GITHUB_TOKEN cannot push to the default branch and cannot merge a pull request,
# whatever any step goes on to run.
permissions:
  contents: read

# A superseded run tells you about a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on every event that reaches this file, and there is no `if:`
# anywhere below. Three used to skip `lint`, `format` and `audit` on the merge
# run; with that run gone the conditions were dead, and a dead condition is
# worse than an absent one -- it describes an event this workflow no longer has,
# and it is the line the next job gets written by copying.
#
# `turbo-cache: "false"` on those same three jobs stays, and it never had
# anything to do with the event: oxlint and `node` are not Turborepo tasks, so
# the cache would be written once per run and read by nothing.
# `.github/actions/setup` carries that reasoning.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm lint

  # `pnpm format` is `oxfmt --check`, so this job reports rather than rewrites.
  #
  # It exists because its absence was measured, not predicted: three files under
  # `docs/` sat unformatted on `dev` and every local `pnpm format:fix` rewrote
  # them, so 54 lines of unrelated churn appeared in whatever pull request its
  # author happened to be writing. During #80 that happened three times and was
  # reverted three times. Formatting drift is invisible without a gate, and the
  # cost of the drift is paid by a *different* change than the one that caused it.
  #
  # `turbo-cache: "false"` for the same reason `lint` sets it: oxfmt reads the
  # whole tree in under a second, so a cache restore costs more than the work.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm format

  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check-types

  # `pnpm test` is `turbo run test test:gates spec-identifiers migrations:check`, so
  # the stage-hook suite is inside this job rather than beside it -- which is what
  # `required-checks` means by "test (including test:gates)".
  #
  # `fetch-depth: 0` because `migrations:check` frames every one of its answers on
  # `git merge-base <default branch> HEAD` (NFR30, DD13). The default shallow
  # checkout has no merge base, and that gate refuses to call "I could not
  # compare" a pass -- it would exit 2 the day the first migration lands.
  #
  # `set-head` is the other half of the same sentence, and it is the half that was
  # missing: the gate needs a *default branch* as well as the history reaching it.
  # On a `pull_request` it reads GITHUB_BASE_REF, which GitHub sets and which is
  # the PR's own base -- the stacked-PR case DD13 depends on. On a `push` that
  # variable does not exist, so the gate falls back to `refs/remotes/origin/HEAD`,
  # the ref every `git clone` writes and `actions/checkout` does not. The merge
  # run on `dev` exited 2 the day the first migration landed for exactly that --
  # one step earlier than the paragraph above predicted.
  #
  # **That run is gone and this step is not**, which is the trap in deleting it
  # as dead weight along with the trigger that first needed it: the
  # `workflow_call` from `deploy.yml` still arrives here as a `push`, to the
  # release branch, carrying no GITHUB_BASE_REF either. Without these three
  # lines the gate would now exit 2 on every deploy rather than on every merge,
  # and it would do it at the one moment nobody wants to debug CI.
  #
  # The branch is read from the webhook payload rather than asked of the remote
  # (`set-head --auto`) or written here as `dev`: the payload carries it on both
  # events, so this costs no network round-trip and no credential, and a clone
  # whose default branch is not `dev` is still not a special case. It goes through
  # `env` rather than into the command line because a `${{ }}` expanded into a
  # shell is an injection seam whatever this particular value happens to be.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Give `migrations:check` a default branch to measure against
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git remote set-head origin "$DEFAULT_BRANCH"
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  # High or above in a *direct* dependency only. The script says why, and
  # `gate-test.sh` holds its cases.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: pnpm audit:direct
