name: Set up the toolchain
description: >-
  Node, pnpm, dependencies and the Turborepo cache for one gate job. Written once
  here rather than five times in the workflow, since every job needs all four.

inputs:
  turbo-cache:
    description: >-
      Whether this job runs a Turborepo task. `lint` and `audit` call oxlint and
      node directly, so for them the cache would be written once per run and read
      by nothing.
    default: "true"

runs:
  using: composite
  steps:
    # No `version:` on purpose. Given none, this action reads `packageManager`
    # from package.json, which is where pnpm 12 is already pinned -- so the
    # version in CI cannot drift from the version a developer runs.
    # Third-party actions are pinned to a commit SHA; `actions/*` to a tag.
    #
    # **v6.1.0 is a floor, not a routine bump.** pnpm 12 ships as a Rust binary
    # resolved through per-platform `@pnpm/exe.*` optional dependencies, and
    # v6.1.0 is the release that learned to install it -- its only feature is
    # "support pnpm v12". Any earlier pin installs nothing usable here, so this
    # SHA may be moved forward but never back.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # `.nvmrc` says `24`, so this resolves to the latest 24.x rather than
    # restating a patch version that would go stale. `engineStrict` in
    # pnpm-workspace.yaml is the backstop: an older runtime fails the install
    # outright instead of warning.
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    # Turborepo's local cache. Keyed per job because each job runs one task, and
    # per commit because `actions/cache` never overwrites an existing key -- a
    # key that did not move would be written once and then never refreshed.
    # `restore-keys` is what makes the next run warm.
    - name: Cache Turborepo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ github.job }}-
