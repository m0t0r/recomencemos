# Dependabot: the other half of `docs/policy/security.md` -> `dependency-policy`.
#
# That key says CI fails on `high` or above in a **direct** dependency. The
# `audit` job is what refuses; this is what proposes the upgrade that clears it.
# Neither is much use alone — a gate with nothing behind it is a gate somebody
# eventually bypasses, which is the failure mode C7 was answered to avoid.
#
# Three ecosystems, and no `target-branch`: the default branch is `dev`, which is
# where Dependabot opens against unless told otherwise.
version: 2

updates:
  # ---------------------------------------------------------------- npm (pnpm)
  #
  # One entry covers the whole monorepo. Dependabot reads `pnpm-workspace.yaml`
  # and expands its `packages:` globs itself, so a per-workspace entry would be
  # both redundant and rejected — overlapping directories for one ecosystem are
  # not allowed.
  #
  # **pnpm 12 is unsupported here, and the lockfile format is the whole reason.**
  # The published support matrix lists pnpm 7–10; pnpm 11 was added in July 2026
  # and labelled beta; pnpm 12 is not supported at all — dependabot/dependabot-core
  # #16095 is open and its two support pull requests, #16169 and #16170, are
  # unmerged.
  #
  # This used to read that the format was "the reassuring part", because every
  # version through 11 wrote one `lockfileVersion: '9.0'` document. Under pnpm 12
  # the format is the risk surface. Left to its default, pnpm 12 writes a
  # **two-document** YAML stream — an environment document naming its own binary
  # first, the dependency graph second — and dependabot-core reads only the
  # first: zero dependencies for every manifest, and existing alerts closed with
  # no update performed (#15904). That failure is silent, which is what makes it
  # worse than a hard error, and this file already records six advisories — four
  # `high` — that sat on the default branch while every pull request went green.
  #
  # `pmOnFail: ignore` in `pnpm-workspace.yaml` is what holds the lockfile to a
  # single document, so Dependabot reads this repo exactly as it did under pnpm
  # 11. The reasoning, and what it gives up, is written beside that setting. If
  # Dependabot ever reports this repository as having no dependencies, check that
  # line before anything else: `grep -c '^---$' pnpm-lock.yaml` must be 0.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota

    # Conventional Commits are fixed by `docs/policy/build.md`, and Dependabot's
    # own default (`Bump x from a to b`) is outside the convention. This yields
    # `chore(deps): bump …` and `chore(deps-dev): bump …`.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

    # `minimumReleaseAge` in `pnpm-workspace.yaml` is 1440 minutes — pnpm's
    # default since v11, unchanged in v12 and re-read rather than assumed at that
    # bump, which the repo takes rather than sets. A package published inside
    # that window does not resolve locally at all, so a Dependabot PR raised
    # sooner would be one nobody could install.
    #
    # Dependabot's own default is already 3 days, and stricter than pnpm's 1, so
    # the two cannot currently disagree. It is set explicitly anyway: the number
    # that matters is the *relationship* between these two files, and a default
    # that changes upstream would break it silently. A major gets a week — the
    # bump most likely to be yanked is the one worth soaking longest.
    cooldown:
      default-days: 3
      semver-major-days: 7

    # Minor and patch arrive as one pull request rather than a dozen. A major
    # still comes on its own, because a major is a decision and a batch of them
    # is a decision nobody makes carefully.
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

    # **`@types/node` is pinned to the Node LTS major, and this is the one
    # dependency `engineStrict` cannot police.** The repo requires the active
    # LTS — `.nvmrc` says `24`, `engines.node` says `>=24`, and
    # `engineStrict: true` makes `pnpm install` *fail* on anything older. That
    # enforcement works by reading a package's own `engines` field, and
    # `@types/node` has none: it is types, not code, so nothing about it fails
    # to install. A `@types/node@26` therefore lands green while describing the
    # API surface of a runtime nobody here runs, and `check-types` starts
    # accepting calls that do not exist on 24. Green CI is exactly the symptom.
    #
    # Majors are ignored rather than the version range being spelled out,
    # because moving Node major is never a standalone pull request: `.nvmrc`,
    # `engines.node` and this dependency move together in one deliberate edit,
    # and that edit is the moment to raise the types package by hand. A
    # `versions:` range would need editing at the very same moment while also
    # being able to drift wrong in silence.
    #
    # The price, stated because `ignore` is blunt: this suppresses *security*
    # updates for `@types/node` too. It ships no runtime code, so the class of
    # advisory this could hide is close to empty — but it is not a rule to copy
    # onto a package that does.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

    # The default. Restated because the constraint behind it is a one-person
    # review queue, not a tooling limit. Security PRs are exempt from this cap.
    open-pull-requests-limit: 5

  # -------------------------------------------------------- github-actions
  #
  # **Both directory entries are load-bearing, and the second one is the reason
  # this is not a one-liner.** With `/` alone Dependabot scans
  # `.github/workflows/` and a root `action.yml`, and nothing else — so the one
  # SHA-pinned action this repo has, `pnpm/action-setup` in
  # `.github/actions/setup/action.yml`, would never be updated. A pinned action
  # nobody updates is the worst of both worlds: the pin's whole purpose is that
  # moving it is a deliberate act, and an act nobody performs is a version
  # frozen at whatever was current the day it was written.
  #
  # The glob form is verified from `github_actions/file_fetcher.rb`, which
  # scans any non-root directory for `*.yml`, rather than from the documentation
  # — which describes only the root behaviour. If it stops working, the symptom
  # is silence, so the SHA pin is worth an eye at review time regardless.
  #
  # Dependabot rewrites the trailing `# v6.0.10` comment along with the SHA when
  # the comment sits on the same line, which is why it is written that way.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    commit-message:
      prefix: chore
      include: scope
    # `semver-*-days` is npm-only; this ecosystem takes `default-days` alone.
    cooldown:
      default-days: 3
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # -------------------------------------------------------- docker-compose
  #
  # `docker-compose.yaml` is the local development database
  # (`docs/policy/data.md` -> `local-database`), and both of its images are
  # pinned by tag **and** digest. A digest is the right pin and the wrong thing
  # to leave alone: it is exact, and it therefore freezes at whatever was
  # current the day somebody typed it. This entry is what makes moving it a
  # deliberate act somebody performs rather than one nobody ever performs.
  #
  # `docker-compose` is its own ecosystem, separate from `docker`, and it
  # supports **version updates only** — no security updates. So a CVE in
  # Postgres or PgBouncer arrives here as an ordinary version bump on a weekly
  # cadence, or not at all. That is acceptable for exactly one reason: these
  # containers listen on loopback on a developer's machine, hold
  # development-tier data, and are in no deployment path. Nothing production
  # depends on this entry.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    commit-message:
      prefix: chore
      include: scope
    # `semver-*-days` is npm-only; this ecosystem takes `default-days` alone.
    cooldown:
      default-days: 3
    groups:
      images:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
