; PgBouncer, in transaction-pooling mode, in front of the local Postgres.
;
; The reason this file exists is `pool_mode` below. PlanetScale's pooler runs in
; transaction mode (spec 0002, DD2) and that mode removes LISTEN/NOTIFY, session
; advisory locks, temp tables and cross-transaction prepared statements. Setting
; it here is what makes the local database refuse what production refuses,
; rather than accepting code that will fail after deploy.
;
; It is a mounted file rather than the image's environment-variable synthesis
; because the setting that carries the argument should be readable, not derived
; from a default.

[databases]
; The direct connection PgBouncer itself opens. `postgres` is the compose
; service name; the host port mapping is irrelevant on this side of it.
recomencemos = host=postgres port=5432 dbname=recomencemos

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Plain passwords in `userlist.txt`, SCRAM on both wires. PgBouncer derives the
; SCRAM exchange with the client from the stored plaintext and authenticates to
; Postgres with it too, so nothing on either hop is sent in the clear. This has
; to agree with `POSTGRES_HOST_AUTH_METHOD` in `docker-compose.yaml` — the
; catch-all `pg_hba` line, which is the one a connection from the compose network
; matches. `POSTGRES_INITDB_ARGS --auth-host` is a different line and not on this
; path.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; **The line this whole file is for.**
pool_mode = transaction

; The default, set explicitly because it is one of the constraints being
; reproduced: at 0, a protocol-level prepared statement is refused. That is why
; DD2 pins `pg` rather than `postgres.js`, which prepares by default — and a
; local default that silently changed upstream would remove the evidence.
max_prepared_statements = 0

; DD2 caps the application pool at 10 per machine. Matching it locally means a
; pool-exhaustion symptom appears at the same number it would in production.
default_pool_size = 10
max_client_conn = 100

; **`stats_users`, and deliberately not `admin_users`.** This is what lets
; `psql -d pgbouncer -c "SHOW CONFIG"` read `pool_mode` back out of the running
; process, which is the check that proves this file took effect. `admin_users`
; would also work and was tried first — it additionally grants PAUSE, RESUME,
; RELOAD, KILL and SHUTDOWN to anyone holding the application credential, which
; is every process on the machine, for a read this does not need. Measured
; rather than assumed: with stats alone, `SHOW CONFIG` returns and `PAUSE`
; answers "admin access needed".
stats_users = recomencemos

; Sent by some clients in the startup packet and meaningless to a pooled
; connection. Without this the connection is refused rather than pooled.
ignore_startup_parameters = extra_float_digits
