# Garage, one node, for the development loop (#299 candidate).
#
# Every value here is development-tier and loopback-bound, in git for the same
# reason the MinIO root password is: nothing reaches this but the laptop.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# One node, so one copy. Garage refuses to serve a bucket until a layout names
# at least `replication_factor` nodes, which is why the init applies one.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Hex of "recomencemos-garage-rpc-dev-only". Declared rather than generated so
# the file is the whole configuration; it guards node-to-node RPC on a network
# only this container is on.
rpc_secret = "7265636f6d656e63656d6f732d6761726167652d7270632d6465762d6f6e6c79"

[s3_api]
# The product signs every request for region `auto`, which is what R2 requires.
# Garage checks the region in the signature scope, so it has to agree.
s3_region = "auto"
api_bind_addr = "[::]:3900"
root_domain = ".s3.localhost"

[s3_web]
# The anonymous read origin. It is a separate listener from the S3 API, and it
# picks the bucket from the Host header: `<bucket>.web.localhost`.
bind_addr = "[::]:3902"
root_domain = ".web.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "recomencemos-garage-admin-dev-only"
