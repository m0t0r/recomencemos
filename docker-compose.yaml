# The local development database and object store: `docs/policy/data.md` →
# `local-database`.
#
# Two services rather than one, and the second one is the whole point.
# PlanetScale's pooler runs in **transaction-pooling** mode (spec 0002, DD2),
# which removes LISTEN/NOTIFY, session advisory locks, temp tables and
# cross-transaction prepared statements. Develop against a plain unpooled
# Postgres and it is possible to write code that passes locally and fails in
# production in exactly that class of way — so PgBouncer runs here too, in the
# same mode, and refuses locally what production refuses.
#
# Both of DD2's connection strings therefore exist and are distinguishable:
#
#   pooled  postgres://recomencemos:recomencemos@localhost:6432/recomencemos
#   direct  postgres://recomencemos:recomencemos@localhost:5432/recomencemos
#
# The app uses the pooled one; migrations, which are DDL in long transactions,
# use the direct one. `apps/web/.env.example` carries both.
#
# **This file is for `pnpm dev` and nothing else.** `pnpm test` runs against
# PGlite in-memory (spec 0002, Testing Decisions seam 2) and CI runs no database
# service at all. Docker is a requirement of the dev loop, not of the repository.
#
# **The credentials below are in git on purpose.** They are development-tier
# values that reach a container listening on loopback, and they are the same
# non-secret in `apps/web/.env.example` and `docker/pgbouncer/userlist.txt`. A
# production URL in any of the three is the incident C13 names — `.env*` is a
# Turborepo `build` input, so it would be one `git add` away.
#
# **The third service is an object store, and it is here for the same argument
# PgBouncer is** (#18, DD6). The photo path is a **presigned PUT** into a
# prefix the bucket refuses to serve — NFR6's _"**0** unmoderated photo
# **objects** are retrievable by an unauthenticated request"_ is a statement
# about that bucket policy rather than about our routing. A development loop
# with no bucket could only exercise it through a stand-in, and a stand-in
# cannot be wrong in the way a signature is wrong. MinIO speaks the same S3
# protocol Cloudflare R2 does, so the code presigning here is the code
# presigning in production.
#
# **`minio-init` is what makes the negative test real.** It creates the bucket
# and then makes exactly one prefix anonymously readable — `photos/`, never
# `quarantine/`. Fetching a quarantined object directly and being refused is
# criterion 1 of #18, and it is only a test if something is actually refusing.
#
# **Images are pinned by tag and digest, stamped at a date**, the way
# `docs/runbooks/observability-go-live.md` pins a vendor figure. Checked
# **2026-08-26**: `postgres:18-alpine` is PostgreSQL **18.6**, `edoburu/pgbouncer`
# `v1.25.2-p0` is PgBouncer **1.25.2**. Checked **2026-09-08**: `minio/minio` is
# `RELEASE.2025-09-07T16-13-09Z` and `minio/mc` is `RELEASE.2025-08-13T08-35-41Z`,
# both the latest at that date. Read from the images, not recalled.
# `.github/dependabot.yml` carries a `docker-compose` entry so the digests move
# on their own rather than freezing at whatever was current today.
#
# The engine version drifts three ways and it is worth knowing by how much:
# PlanetScale runs 18.4, PGlite 0.5.7 is 18.3, this is 18.6. One major version,
# which is what seam 2's argument rests on.

name: recomencemos

services:
  # The direct connection. DDL, long transactions and anything session-scoped.
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: recomencemos
      POSTGRES_PASSWORD: recomencemos
      POSTGRES_DB: recomencemos
      # **Two settings, because they govern different lines of `pg_hba.conf`,
      # and only one of them is on PgBouncer's path.** Read out of the image's
      # `docker-entrypoint.sh` rather than assumed:
      #
      #   POSTGRES_HOST_AUTH_METHOD appends `host all all all <method>` — the
      #   catch-all line, and the one a connection from the compose network
      #   matches. This is the load-bearing one. Left unset it defaults to the
      #   server's `password_encryption`, which is already scram-sha-256 on 18;
      #   it is set anyway so that `auth_type` in `pgbouncer.ini` is agreeing
      #   with something stated rather than with an upstream default.
      #
      #   POSTGRES_INITDB_ARGS --auth-host governs the initdb-generated
      #   127.0.0.1/::1 lines, which only in-container loopback ever uses.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      # **Bound to loopback, not to `0.0.0.0`.** A bare "5432:5432" publishes the
      # development database to every host on whatever network the laptop is
      # joined to — a café, a co-working space, a conference — with a password
      # that is committed to a public repository. The host-IP prefix is the
      # whole mitigation, and it is why the credentials below can honestly be
      # called non-secret.
      - "127.0.0.1:5432:5432"
    volumes:
      # `/var/lib/postgresql`, not `/var/lib/postgresql/data`. The 18 images
      # store the cluster in a major-version-specific subdirectory so that
      # `pg_upgrade --link` can cross versions without a mount-point boundary,
      # and they **refuse to start** against the old path. Verified by hitting
      # it: `docker-library/postgres` PR #1259.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory. `citext` and `pg_trgm` are what
      # seam 2 depends on (spec 0002, Testing Decisions) and what a human
      # enables by hand on PlanetScale at go-live runbook §2 — they are enabled
      # out of band on both, so they are enabled out of band here rather than in
      # a migration that could not run against PlanetScale anyway.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-U`/`-d` so this reads the application database rather than the
      # bootstrap one, and `-q` so a passing check is silent.
      test: ["CMD-SHELL", "pg_isready -q -U recomencemos -d recomencemos"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # The pooled connection. What the app uses, and what makes local as
  # constrained as production.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    # Run the binary against a mounted config instead of the image's
    # entrypoint, which synthesises `pgbouncer.ini` from environment variables.
    # The setting that gives this file its reason to exist is `pool_mode`, and
    # it should be readable in a file rather than inferred from an env default.
    # Overriding `entrypoint` clears the image's `command`, so nothing is
    # appended after the config path.
    entrypoint: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      # Loopback, for the reason written on the postgres service above.
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # PgBouncer answers a startup packet before any pool exists, so this
      # proves the listener, not the route to Postgres. `depends_on:
      # service_healthy` above is what proves the route.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 6432 -U recomencemos"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The object store. Photos, in two buckets with two different lifetimes.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Development-tier, loopback-bound, and in git for the reason the Postgres
      # password above is: `apps/web/.env.example` carries the same pair, and a
      # real R2 key in either file is the incident C13 names.
      MINIO_ROOT_USER: recomencemos
      MINIO_ROOT_PASSWORD: recomencemos
      # Off, because this is a laptop's dev loop and the check phones home.
      MINIO_UPDATE: "off"
    ports:
      # Loopback, for the reason written on the postgres service above — and
      # here it is doing more work than there: a bucket published to a café
      # network is a bucket a stranger can PUT into with a committed password.
      - "127.0.0.1:9000:9000"
      # The console. Useful for looking at what a test actually wrote, and
      # deliberately not something any code reads.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # MinIO's own liveness endpoint. `mc ready` would need the client image;
      # this needs nothing the server does not already have.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Runs once, exits, and is what makes the two buckets different.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    # `--ignore-existing` and `anonymous set` are both idempotent, so this is
    # safe to re-run on every `pnpm db:up` rather than only on a fresh volume.
    #
    # **`anonymous set download` on the whole photos bucket and nothing at all
    # on the quarantine one.** That asymmetry is the point of this service, and
    # it is stated at the *bucket* rather than at a prefix because that is the
    # only place R2 can state it: public access there is one switch per bucket,
    # with no per-prefix policy and no S3-style bucket policy behind it (#251).
    # A prefix-scoped rule here would be a local capability production has no
    # way to reproduce — which is the failure a fixture is supposed to prevent
    # rather than commit. Runbook §3 is these same acts performed by a human.
    #
    # **One direction of infidelity is left, and it is named rather than fixed.**
    # MinIO's bucket-scope `download` policy also grants anonymous `ListBucket`
    # — measured: `GET /recomencemos-photos/?list-type=2` answers 200 here,
    # while the quarantine bucket answers 403 — and an R2 public bucket serves
    # objects and never lists. So this fixture is *more* permissive than
    # production on listing, which is the safe direction for a fixture to err
    # in: nothing here can pass that production would refuse. It is harmless
    # besides, since that bucket holds only photos the Wall already publishes.
    # Do not close it by narrowing the policy back to the `photos` prefix —
    # that trades a listing difference for the access-model difference #251 was
    # about.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 recomencemos recomencemos
        mc mb --ignore-existing local/recomencemos-photos
        mc mb --ignore-existing local/recomencemos-photos-quarantine
        mc anonymous set download local/recomencemos-photos
        mc anonymous set none local/recomencemos-photos-quarantine

volumes:
  # Named, so `pnpm db:down` keeps the data and `pnpm db:reset` is the deliberate
  # act that discards it.
  postgres-data:
  # Same treatment, and it matters more here: a photo is bytes nothing else
  # holds a copy of, so a `down` that discarded them would lose whatever a
  # session had uploaded to look at.
  minio-data:
